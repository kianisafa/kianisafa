<radialGradient id="depth-volume"><stop stop-color="#6ce9db" stop-opacity=".12"/><stop offset=".48" stop-color="#92a5ff" stop-opacity=".045"/><stop offset="1" stop-color="#6ce9db" stop-opacity="0"/></radialGradient>
