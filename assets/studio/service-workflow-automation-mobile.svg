<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title"><title id="title">Workflow Automation</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10182c"/><stop offset=".5" stop-color="#0a1223"/><stop offset="1" stop-color="#070e19"/></linearGradient><linearGradient id="glass" x2=".8" y2="1"><stop stop-color="#ac9bff" stop-opacity=".2"/><stop offset="1" stop-color="#182038" stop-opacity=".5"/></linearGradient><linearGradient id="edge"><stop stop-color="#ac9bff" stop-opacity=".1"/><stop offset=".5" stop-color="#ac9bff"/><stop offset="1" stop-color="#ac9bff" stop-opacity=".1"/></linearGradient><radialGradient id="glow"><stop stop-color="#ac9bff" stop-opacity=".17"/><stop offset="1" stop-color="#ac9bff" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="8"/></filter><clipPath id="frame"><rect x="1" y="1" width="598" height="338" rx="18"/></clipPath><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#f1fffd"/><stop offset=".4" stop-color="#ac9bff"/><stop offset="1" stop-color="#567b8f"/></linearGradient><linearGradient id="screen" x2=".8" y2="1"><stop stop-color="#182c48"/><stop offset="1" stop-color="#091222"/></linearGradient><linearGradient id="depth-spectrum" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ac9bff" stop-opacity=".12"/><stop offset=".5" stop-color="#70e3d5" stop-opacity=".65"/><stop offset="1" stop-color="#ac9bff" stop-opacity=".85"/></linearGradient>
<radialGradient id="depth-volume"><stop stop-color="#ac9bff" stop-opacity=".12"/><stop offset=".48" stop-color="#70e3d5" stop-opacity=".045"/><stop offset="1" stop-color="#ac9bff" stop-opacity="0"/></radialGradient>
