<mask id="depth-readable"><rect width="600" height="151" fill="url(#depth-focus)"/></mask></defs><style id="depth-motion-styles">
.depth-space{animation:depthSpace 24s ease-in-out infinite}
.depth-far{animation:depthFar 29s ease-in-out infinite;transform-origin:50% 50%;transform-box:view-box}
.depth-near{animation:depthNear 19s ease-in-out infinite;transform-origin:50% 50%;transform-box:view-box}
.depth-ribbon{stroke-dasharray:80 34 4 34;animation:depthTravel 23s linear infinite}
.depth-counter{stroke-dasharray:35 70 3 70;animation:depthTravel 31s linear reverse infinite}
.depth-shard{animation:depthShard 17s ease-in-out infinite}
.depth-plane{animation:depthPlane 21s ease-in-out infinite;transform-origin:50% 50%;transform-box:view-box}
.depth-gate{animation:depthGate 20s ease-in-out infinite;transform-origin:74% 48%;transform-box:view-box}
@keyframes depthSpace{0%,100%{transform:translate(-5px,-3px)}50%{transform:translate(5px,3px)}}
@keyframes depthFar{0%,100%{transform:translate(-4px,2px) rotate(-1.8deg)}50%{transform:translate(6px,-3px) rotate(1.8deg)}}
@keyframes depthNear{0%,100%{transform:translate(5px,-3px) rotate(1.6deg)}50%{transform:translate(-6px,4px) rotate(-1.6deg)}}
@keyframes depthTravel{to{stroke-dashoffset:-608}}
@keyframes depthShard{0%,100%{transform:translate(0,0);opacity:.45}50%{transform:translate(6px,-8px);opacity:.9}}
@keyframes depthPlane{0%,100%{transform:scale(.95);opacity:.55}50%{transform:scale(1.06);opacity:.85}}
@keyframes depthGate{0%,100%{transform:scale(.94) rotate(-4deg)}50%{transform:scale(1.08) rotate(4deg)}}
@media(prefers-reduced-motion:reduce){.depth-space,.depth-far,.depth-near,.depth-ribbon,.depth-counter,.depth-shard,.depth-plane,.depth-gate{animation:none!important}}
</style><style>
text{font-family:Segoe UI,Arial,sans-serif}.float{animation:float 7s ease-in-out infinite}.float2{animation:float 9s ease-in-out -3s infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 32s linear infinite}.orbit2{transform-box:fill-box;transform-origin:center;animation:spin 42s linear reverse infinite}.flow{stroke-dasharray:8 20;animation:flow 12s linear infinite}.breathe{animation:breathe 6s ease-in-out infinite}.scan{animation:scan 11s ease-in-out infinite}.portal{transform-box:fill-box;transform-origin:center;animation:portal 10s ease-in-out infinite}.still{display:none}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-280}}@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.85}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(90px)}}@keyframes portal{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}@media(prefers-reduced-motion:reduce){.float,.float2,.orbit,.orbit2,.flow,.breathe,.scan,.portal{animation:none!important}.motion{display:none}.still{display:inline}}
