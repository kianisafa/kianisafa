@keyframes depthTravel{to{stroke-dashoffset:-608}}
@keyframes depthShard{0%,100%{transform:translate(0,0);opacity:.45}50%{transform:translate(6px,-8px);opacity:.9}}
@keyframes depthPlane{0%,100%{transform:scale(.95);opacity:.55}50%{transform:scale(1.06);opacity:.85}}
@keyframes depthGate{0%,100%{transform:scale(.94) rotate(-4deg)}50%{transform:scale(1.08) rotate(4deg)}}
@media(prefers-reduced-motion:reduce){.depth-space,.depth-far,.depth-near,.depth-ribbon,.depth-counter,.depth-shard,.depth-plane,.depth-gate{animation:none!important}}
</style><style>
